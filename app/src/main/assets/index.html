<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>喵记账</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #18181b;
      --text: #1f2937;
      --muted: #8b929e;
      --line: #eef0f4;
      --accent: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 12px 14px 88px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .num { font-variant-numeric: tabular-nums; }

    /* 顶栏 */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: #fff3c4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.3px;
    }
    .topbar-action {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 8px;
      cursor: pointer;
    }

    /* 周期切换 */
    .seg {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #e9ecf0;
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
    }
    .seg-btn.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* 深色汇总卡（钱迹/极简账本风格） */
    .hero {
      background: var(--ink);
      color: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .hero-period {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #d4d4d8;
      font-weight: 500;
    }
    .nav-btn {
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #e4e4e7;
      border-radius: 6px;
      width: 24px;
      height: 24px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hero-label {
      font-size: 12px;
      color: #a1a1aa;
    }
    .hero-amount {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.6px;
      margin: 2px 0 14px;
    }
    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #27272a;
      padding-top: 10px;
      gap: 8px;
    }
    .metric-k { font-size: 11px; color: #a1a1aa; }
    .metric-v { font-size: 13.5px; font-weight: 600; margin-top: 2px; color: #f4f4f5; }

    /* 通用白卡片 */
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 分类占比 */
    .cat-item { margin-bottom: 11px; }
    .cat-item:last-child { margin-bottom: 0; }
    .cat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin-bottom: 5px;
    }
    .cat-name {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 500;
    }
    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .cat-val { color: var(--text); font-weight: 600; }
    .cat-pct { color: var(--muted); font-weight: 400; margin-left: 4px; font-size: 11.5px; }
    .bar-bg {
      height: 6px;
      background: #f1f3f6;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* 筛选条 */
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f8f9fb;
      color: #64748b;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    /* 按天分组明细 */
    .day-hdr {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
      padding: 10px 0 6px;
      border-bottom: 1px solid var(--line);
    }
    .day-hdr:first-child { padding-top: 2px; }
    .tx-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .tx-row:last-child { border-bottom: none; padding-bottom: 2px; }
    .tx-row:active { background: #fafafa; }
    .tx-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .tx-mid { flex: 1; min-width: 0; }
    .tx-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .tx-right { text-align: right; flex-shrink: 0; }
    .tx-amt { font-size: 15px; font-weight: 600; color: var(--ink); }
    .tx-cat { font-size: 11px; color: var(--muted); margin-top: 1px; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 0;
      font-size: 13px;
    }

    /* 底部固定操作栏 */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      z-index: 50;
    }
    .btn-import {
      flex: 1;
      text-align: center;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-import input { display: none; }
    .btn-add {
      flex: 1.3;
      padding: 11px 12px;
      border-radius: 12px;
      border: none;
      background: var(--ink);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 底部弹窗 Sheet */
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 100;
      display: none;
      align-items: flex-end;
    }
    .mask.open { display: flex; }
    .sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 24px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-title { font-size: 15px; font-weight: 700; color: var(--ink); }
    .sheet-close {
      border: none;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .cat-opt {
      padding: 9px 4px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #f9fafb;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      cursor: pointer;
    }
    .cat-opt.selected {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }
    .field {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #f9fafb;
      outline: none;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .field:focus { border-color: var(--ink); background: #fff; }
    .btn-full {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      border: none;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-del {
      width: 100%;
      padding: 11px;
      border-radius: 11px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 24, 27, 0.92);
      color: #fff;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      z-index: 200;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🐱</div>
      <div class="brand-name">喵记账</div>
    </div>
    <button class="topbar-action" onclick="clearAllData()">清空数据</button>
  </div>

  <div class="seg">
    <button class="seg-btn" id="tab-day" onclick="setPeriodMode('day')">日</button>
    <button class="seg-btn active" id="tab-month" onclick="setPeriodMode('month')">月</button>
    <button class="seg-btn" id="tab-year" onclick="setPeriodMode('year')">年</button>
    <button class="seg-btn" id="tab-all" onclick="setPeriodMode('all')">全部</button>
  </div>

  <div class="hero">
    <div class="hero-top">
      <div class="hero-label" id="total-label">本月支出</div>
      <div class="hero-period" id="period-nav">
        <button class="nav-btn" onclick="shiftPeriod(-1)">‹</button>
        <span id="period-label" class="num">2026年11月</span>
        <button class="nav-btn" onclick="shiftPeriod(1)">›</button>
      </div>
    </div>
    <div class="hero-amount num" id="total-amount">¥0.00</div>
    <div class="hero-metrics">
      <div>
        <div class="metric-k">笔数</div>
        <div class="metric-v num" id="stat-count">0 笔</div>
      </div>
      <div>
        <div class="metric-k">日均</div>
        <div class="metric-v num" id="stat-avg">¥0.00</div>
      </div>
      <div>
        <div class="metric-k">单笔最高</div>
        <div class="metric-v num" id="stat-max">¥0.00</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">分类构成</div>
    <div id="category-bars"></div>
  </div>

  <div class="card">
    <div class="card-title">消费明细</div>
    <div class="filters" id="filter-bar"></div>
    <div id="tx-list"></div>
  </div>

  <div class="bottom-bar">
    <label class="btn-import">
      导入账单
      <input type="file" id="csv-file" accept=".csv,.xlsx,.zip,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*" onchange="handleFileUpload(event)" />
    </label>
    <button class="btn-add" onclick="openAddSheet()">+ 记一笔</button>
  </div>

  <!-- 记一笔弹窗 -->
  <div class="mask" id="add-mask" onclick="closeSheet('add-mask', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-hdr">
        <div class="sheet-title">记一笔</div>
        <button class="sheet-close" onclick="closeSheet('add-mask')">关闭</button>
      </div>
      <input id="manual-amt" class="field num" type="number" inputmode="decimal" step="0.01" placeholder="金额（元）" style="font-size:20px;font-weight:700;" />
      <div class="cat-grid" id="add-cat-grid"></div>
      <input id="manual-note" class="field" type="text" placeholder="商户或备注（选填）" />
      <input id="manual-date" class="field" type="date" />
      <button class="btn-full" onclick="saveManualEntry()">保存</button>
    </div>
  </div>

  <!-- 编辑/删除弹窗 -->
  <div class="mask" id="edit-mask" onclick="closeSheet('edit-mask', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-hdr">
        <div class="sheet-title" id="edit-title">修改分类</div>
        <button class="sheet-close" onclick="closeSheet('edit-mask')">关闭</button>
      </div>
      <div class="cat-grid" id="edit-cat-grid"></div>
      <button class="btn-del" onclick="deleteEditingRecord()">删除这笔记录</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'power_ledger_records_v1';
    const MERCHANT_RULES_KEY = 'power_ledger_merchant_rules_v1';
    const CATEGORIES = ['餐饮', '交通', '日用便利', '生活缴费', '休闲娱乐', '转账人情', '购物'];
    const CAT_COLORS = {
      '餐饮': '#f59e0b',
      '交通': '#3b82f6',
      '日用便利': '#10b981',
      '生活缴费': '#06b6d4',
      '休闲娱乐': '#ec4899',
      '转账人情': '#6366f1',
      '购物': '#8b5cf6'
    };
    const CAT_SHORT = {
      '餐饮': '餐',
      '交通': '行',
      '日用便利': '日',
      '生活缴费': '缴',
      '休闲娱乐': '娱',
      '转账人情': '转',
      '购物': '购'
    };

    const ORDERED_KEYWORDS = [
      ['生活缴费', ['话费', '充值', '中国移动', '中国联通', '中国电信', '物业', '水费', '电费', '燃气', '宽带', '供暖', '社保']],
      ['休闲娱乐', ['烫发', '染发', '美发', '理发', '沙龙', '美甲', '滑雪', '门票', '影院', '电影', 'ktv', '游乐', '景区', '健身', '按摩', '足浴', '网费', '会员', '游戏', '网络']],
      ['交通', ['地铁', '公交', '打车', '滴滴', '高德打车', '花小猪', '高铁', '火车', '12306', '出行', '加油', '停车', '高速', '电车', 'suica', 'pasmo', 'icoca', '出租', '单车']],
      ['餐饮', ['外卖', '闪购', '小时达', '餐', '饭', '面', '粉', '米线', '麻辣', '香锅', '火锅', '涮', '烧烤', '烤肉', '炸鸡', '汉堡', '披萨', '必胜客', '麦当劳', '肯德基', '瑞幸', '星巴克', '咖啡', '奶茶', '茶饮', '饮品', '饮', '甜品', '蛋糕', '面包', '零食', '好想来', '居酒屋', '拉面', '便当', '小吃', '烩面', '拌面', '堡', '饿了么', '食堂', '早餐', '夜宵']],
      ['日用便利', ['便利', '全家', '罗森', '7-11', '7eleven', '超市', '菜', '生鲜', '水果', '买菜', '日用', '药妆', '药房', '药店', '松本清', '百货', '商贸', '洗护', '纸巾']],
      ['转账人情', ['微信转账', '支付宝转账', '转账', '确认收款', '待朋友收款', '扫二维码付款', '二维码收款', '发红包', '亲属卡']]
    ];
    const PLATFORM_KEYWORDS = ['淘宝', '京东', '拼多多', '商城', '旗舰店', '服饰', '数码', '亚马逊', 'amazon', '乐天', '美团', '抖音'];

    let activeFilter = '全部';
    let periodMode = 'month';
    let cursorDate = new Date();
    let selectedAddCat = '餐饮';
    let editingId = null;
    let records = loadJson(STORAGE_KEY, []);
    let merchantRules = loadJson(MERCHANT_RULES_KEY, {});

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { el.style.display = 'none'; }, 2400);
    }

    function classify(text, amount, merchant) {
      const mKey = (merchant || '').trim();
      if (mKey && merchantRules[mKey] && CATEGORIES.includes(merchantRules[mKey])) {
        return merchantRules[mKey];
      }
      const lower = (text || '').toLowerCase();
      for (const [cat, kws] of ORDERED_KEYWORDS) {
        if (kws.some(kw => lower.includes(kw))) return cat;
      }
      if (PLATFORM_KEYWORDS.some(kw => lower.includes(kw))) {
        return amount <= 35 ? '餐饮' : '购物';
      }
      if (amount <= 35) return '餐饮';
      if (amount <= 150) return '日用便利';
      return '购物';
    }

    function setPeriodMode(mode) {
      periodMode = mode;
      ['day', 'month', 'year', 'all'].forEach(m => {
        document.getElementById('tab-' + m).classList.toggle('active', m === mode);
      });
      render();
    }

    function shiftPeriod(delta) {
      if (periodMode === 'day') {
        cursorDate = new Date(cursorDate.getFullYear(), cursorDate.getMonth(), cursorDate.getDate() + delta);
      } else if (periodMode === 'month') {
        cursorDate = new Date(cursorDate.getFullYear(), cursorDate.getMonth() + delta, 1);
      } else if (periodMode === 'year') {
        cursorDate = new Date(cursorDate.getFullYear() + delta, 0, 1);
      }
      render();
    }

    function filterByPeriod(list) {
      if (periodMode === 'all') return list;
      const y = cursorDate.getFullYear();
      const m = cursorDate.getMonth();
      const d = cursorDate.getDate();
      return list.filter(r => {
        const dt = new Date(r.timestamp || Date.now());
        if (periodMode === 'year') return dt.getFullYear() === y;
        if (periodMode === 'month') return dt.getFullYear() === y && dt.getMonth() === m;
        return dt.getFullYear() === y && dt.getMonth() === m && dt.getDate() === d;
      });
    }

    function getPeriodDaysCount(periodList) {
      if (periodMode === 'day') return 1;
      if (periodMode === 'month') {
        const now = new Date();
        if (cursorDate.getFullYear() === now.getFullYear() && cursorDate.getMonth() === now.getMonth()) {
          return Math.max(1, now.getDate());
        }
        return new Date(cursorDate.getFullYear(), cursorDate.getMonth() + 1, 0).getDate();
      }
      if (periodMode === 'year') {
        const now = new Date();
        if (cursorDate.getFullYear() === now.getFullYear()) {
          const start = new Date(now.getFullYear(), 0, 1);
          return Math.max(1, Math.ceil((now - start) / 86400000));
        }
        return 365;
      }
      const days = new Set(periodList.map(r => {
        const dt = new Date(r.timestamp || Date.now());
        return `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
      }));
      return Math.max(1, days.size);
    }

    /* 记一笔弹窗 */
    function openAddSheet() {
      document.getElementById('manual-amt').value = '';
      document.getElementById('manual-note').value = '';
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('manual-date').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      renderAddCatGrid();
      document.getElementById('add-mask').classList.add('open');
      setTimeout(() => document.getElementById('manual-amt').focus(), 100);
    }

    function renderAddCatGrid() {
      document.getElementById('add-cat-grid').innerHTML = CATEGORIES.map(c => `
        <button class="cat-opt ${selectedAddCat === c ? 'selected' : ''}" onclick="selectAddCat('${c}')">${c}</button>
      `).join('');
    }

    function selectAddCat(cat) {
      selectedAddCat = cat;
      renderAddCatGrid();
    }

    function saveManualEntry() {
      const amt = parseFloat(document.getElementById('manual-amt').value);
      if (!amt || amt <= 0) {
        showToast('请输入有效金额');
        return;
      }
      const note = document.getElementById('manual-note').value.trim();
      const dateStr = document.getElementById('manual-date').value;
      let ts = Date.now();
      if (dateStr) {
        const now = new Date();
        const p = dateStr.split('-').map(Number);
        if (p.length === 3) ts = new Date(p[0], p[1] - 1, p[2], now.getHours(), now.getMinutes(), now.getSeconds()).getTime();
      }
      records.unshift({
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        amount: amt,
        merchant: (note || selectedAddCat).slice(0, 24),
        category: selectedAddCat,
        channel: '手动',
        timestamp: ts
      });
      records.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      saveRecords();
      cursorDate = new Date(ts);
      closeSheet('add-mask');
      render();
      showToast(`已记录 -${amt.toFixed(2)}`);
    }

    /* 编辑/删除弹窗 */
    function openEditSheet(id) {
      const target = records.find(r => r.id === id);
      if (!target) return;
      editingId = id;
      document.getElementById('edit-title').textContent = target.merchant;
      document.getElementById('edit-cat-grid').innerHTML = CATEGORIES.map(c => `
        <button class="cat-opt ${target.category === c ? 'selected' : ''}" onclick="applyEditCat('${c}')">${c}</button>
      `).join('');
      document.getElementById('edit-mask').classList.add('open');
    }

    function applyEditCat(newCat) {
      const target = records.find(r => r.id === editingId);
      if (target) {
        target.category = newCat;
        const generic = ['淘宝平台商户', '抖音生活服务商家', '美团', '京东', '账单导入'];
        if (target.merchant && !generic.includes(target.merchant)) {
          merchantRules[target.merchant] = newCat;
          localStorage.setItem(MERCHANT_RULES_KEY, JSON.stringify(merchantRules));
        }
        saveRecords();
        render();
      }
      closeSheet('edit-mask');
    }

    function deleteEditingRecord() {
      records = records.filter(r => r.id !== editingId);
      saveRecords();
      closeSheet('edit-mask');
      render();
    }

    function closeSheet(id, e) {
      if (e && e.target && e.target.id !== id) return;
      document.getElementById(id).classList.remove('open');
    }

    function clearAllData() {
      if (!confirm('确定清空所有本地账单数据吗？')) return;
      records = [];
      saveRecords();
      render();
      showToast('已清空');
    }

    /* CSV / XLSX / ZIP 解析 */
    function parseCsvLine(line) {
      const res = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          res.push(cur.trim()); cur = '';
        } else {
          cur += ch;
        }
      }
      res.push(cur.trim());
      return res;
    }

    function decodeCsvBuffer(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes.length >= 2 && ((bytes[0] === 0xFF && bytes[1] === 0xFE) || (bytes[0] === 0xFE && bytes[1] === 0xFF))) {
        try { return new TextDecoder(bytes[0] === 0xFF ? 'utf-16le' : 'utf-16be').decode(buffer); } catch (e) {}
      }
      const utf8 = new TextDecoder('utf-8').decode(buffer);
      if (utf8.includes('交易时间') && utf8.includes('交易对方')) return utf8;
      try {
        const gbk = new TextDecoder('gb18030').decode(buffer);
        if (gbk.includes('交易时间') && gbk.includes('交易对方')) return gbk;
      } catch (e) {}
      return utf8;
    }

    async function unzipEntries(buffer) {
      const view = new DataView(buffer);
      const bytes = new Uint8Array(buffer);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd === -1) throw new Error('Invalid XLSX/ZIP');
      let ptr = view.getUint32(eocd + 16, true);
      const total = view.getUint16(eocd + 10, true);
      const entries = {};
      const dec = new TextDecoder('utf-8');

      for (let i = 0; i < total; i++) {
        if (view.getUint32(ptr, true) !== 0x02014b50) break;
        const method = view.getUint16(ptr + 10, true);
        const compSize = view.getUint32(ptr + 20, true);
        const nLen = view.getUint16(ptr + 28, true);
        const eLen = view.getUint16(ptr + 30, true);
        const cLen = view.getUint16(ptr + 32, true);
        const lOff = view.getUint32(ptr + 42, true);
        const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nLen));
        ptr += 46 + nLen + eLen + cLen;

        const lnLen = view.getUint16(lOff + 26, true);
        const leLen = view.getUint16(lOff + 28, true);
        const start = lOff + 30 + lnLen + leLen;
        const slice = bytes.subarray(start, start + compSize);
        if (method === 0) {
          entries[name] = slice.buffer.slice(slice.byteOffset, slice.byteOffset + slice.byteLength);
        } else if (method === 8) {
          entries[name] = await new Response(new Blob([slice]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
        }
      }
      return entries;
    }

    function colRefToIndex(ref) {
      const m = (ref || '').match(/^([A-Z]+)/i);
      if (!m) return -1;
      let idx = 0;
      const letters = m[1].toUpperCase();
      for (let i = 0; i < letters.length; i++) idx = idx * 26 + (letters.charCodeAt(i) - 64);
      return idx - 1;
    }

    function parseXlsxEntries(entries) {
      const dec = new TextDecoder('utf-8');
      const dom = new DOMParser();
      const shared = [];
      if (entries['xl/sharedStrings.xml']) {
        const sDoc = dom.parseFromString(dec.decode(entries['xl/sharedStrings.xml']), 'text/xml');
        const sis = sDoc.getElementsByTagName('si');
        for (let i = 0; i < sis.length; i++) {
          const ts = sis[i].getElementsByTagName('t');
          let s = '';
          for (let j = 0; j < ts.length; j++) s += ts[j].textContent || '';
          shared.push(s);
        }
      }
      const sheetKey = Object.keys(entries).find(k => /^xl\/worksheets\/sheet\d+\.xml$/i.test(k));
      if (!sheetKey) return [];
      const doc = dom.parseFromString(dec.decode(entries[sheetKey]), 'text/xml');
      const rowNodes = doc.getElementsByTagName('row');
      const rows = [];
      for (let r = 0; r < rowNodes.length; r++) {
        const cells = rowNodes[r].getElementsByTagName('c');
        const rowArr = [];
        for (let c = 0; c < cells.length; c++) {
          const cell = cells[c];
          const colIdx = colRefToIndex(cell.getAttribute('r'));
          const target = colIdx >= 0 ? colIdx : rowArr.length;
          const t = cell.getAttribute('t');
          let val = '';
          if (t === 's') {
            const v = cell.getElementsByTagName('v')[0];
            val = v ? (shared[parseInt(v.textContent, 10)] || '') : '';
          } else if (t === 'inlineStr') {
            const ts = cell.getElementsByTagName('t');
            for (let k = 0; k < ts.length; k++) val += ts[k].textContent || '';
          } else {
            const v = cell.getElementsByTagName('v')[0];
            val = v ? (v.textContent || '') : '';
          }
          rowArr[target] = val.trim();
        }
        rows.push(rowArr.map(v => v || ''));
      }
      return rows;
    }

    async function extractRows(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes.length >= 2 && bytes[0] === 0x50 && bytes[1] === 0x4B) {
        const entries = await unzipEntries(buffer);
        if (entries['xl/workbook.xml'] || Object.keys(entries).some(k => k.startsWith('xl/worksheets/'))) {
          return parseXlsxEntries(entries);
        }
        const csvKey = Object.keys(entries).find(k => k.toLowerCase().endsWith('.csv'));
        if (csvKey) return decodeCsvBuffer(entries[csvKey]).split(/\r?\n/).filter(l => l.trim()).map(parseCsvLine);
        const xlsxKey = Object.keys(entries).find(k => k.toLowerCase().endsWith('.xlsx'));
        if (xlsxKey) return parseXlsxEntries(await unzipEntries(entries[xlsxKey]));
      }
      return decodeCsvBuffer(buffer).split(/\r?\n/).filter(l => l.trim()).map(parseCsvLine);
    }

    function handleFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const rows = await extractRows(reader.result);
          let headerIdx = -1, headers = [];
          for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].map(c => String(c || '').replace(/^\uFEFF/, '').trim());
            if (cols.some(c => c.includes('交易时间')) && cols.some(c => c.includes('交易对方')) && cols.some(c => c.includes('收/支'))) {
              headerIdx = i; headers = cols; break;
            }
          }
          if (headerIdx === -1) {
            showToast('未识别到微信/支付宝账单表头');
            event.target.value = '';
            return;
          }

          const idxTime = headers.findIndex(h => h.includes('交易时间'));
          const idxTxType = headers.findIndex(h => h.includes('交易类型'));
          const idxPeer = headers.findIndex(h => h.includes('交易对方'));
          const idxGoods = headers.findIndex(h => h.includes('商品'));
          const idxType = headers.findIndex(h => h.includes('收/支'));
          const idxAmt = headers.findIndex(h => h.includes('金额'));
          const idxStatus = headers.findIndex(h => h.includes('当前状态') || h.includes('交易状态'));
          const idxOrder = headers.findIndex(h => h.includes('交易单号') || h.includes('交易订单号'));

          const existingOrders = new Set(records.map(r => r.orderNo).filter(Boolean));
          let imported = 0, skippedRefund = 0;

          for (let i = headerIdx + 1; i < rows.length; i++) {
            const cols = rows[i];
            if (!cols || cols.length < 4) continue;
            if (!(cols[idxType] || '').includes('支出')) continue;

            let amount = parseFloat((cols[idxAmt] || '').replace(/[¥￥,\s元]/g, ''));
            if (!amount || amount <= 0) continue;

            const status = idxStatus >= 0 ? (cols[idxStatus] || '').trim() : '';
            if (status.includes('已全额退款') || status === '已退款' || status.includes('交易关闭')) {
              skippedRefund++;
              continue;
            }
            const partial = status.match(/已退款\s*[（(]\s*[¥￥]?\s*([0-9]+(?:\.[0-9]{1,2})?)\s*[)）]/);
            if (partial) {
              const ref = parseFloat(partial[1]);
              if (ref > 0) amount = Math.round((amount - ref) * 100) / 100;
              if (amount <= 0) { skippedRefund++; continue; }
            }

            const orderNo = idxOrder >= 0 ? (cols[idxOrder] || '').trim() : '';
            const timeStr = (cols[idxTime] || '').trim();
            const txType = idxTxType >= 0 ? (cols[idxTxType] || '').trim() : '';
            const peer = (cols[idxPeer] || '').trim();
            const goods = idxGoods >= 0 ? (cols[idxGoods] || '').trim() : '';
            const dedupOrder = orderNo || `${timeStr}_${peer}_${amount.toFixed(2)}`;

            if (existingOrders.has(dedupOrder)) continue;
            existingOrders.add(dedupOrder);

            const merchant = peer || (goods && goods !== '/' ? goods : '账单导入');
            const ts = Date.parse(timeStr.replace(/-/g, '/')) || Date.now();
            const category = classify(`${txType} ${peer} ${goods}`, amount, merchant);

            records.push({
              id: 'csv_' + dedupOrder,
              orderNo: dedupOrder,
              amount,
              merchant: merchant.slice(0, 24),
              category,
              channel: partial ? '账单(已扣退款)' : '账单导入',
              timestamp: ts
            });
            imported++;
          }

          records.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          saveRecords();
          if (imported > 0 && records.length > 0) cursorDate = new Date(records[0].timestamp);
          render();
          showToast(imported > 0
            ? `导入 ${imported} 笔` + (skippedRefund > 0 ? `，已过滤 ${skippedRefund} 笔退款` : '')
            : (skippedRefund > 0 ? `已过滤 ${skippedRefund} 笔退款，无新支出` : '没有新的支出记录'));
        } catch (err) {
          showToast('解析失败');
        }
        event.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function formatTimeShort(ts) {
      const d = new Date(ts || Date.now());
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function formatDayHeader(ts) {
      const d = new Date(ts || Date.now());
      const weeks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const pad = n => String(n).padStart(2, '0');
      return {
        key: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
        label: `${d.getMonth() + 1}月${d.getDate()}日 ${weeks[d.getDay()]}`
      };
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function render() {
      const navEl = document.getElementById('period-nav');
      const labelEl = document.getElementById('period-label');
      const titleEl = document.getElementById('total-label');
      const pad = n => String(n).padStart(2, '0');

      if (periodMode === 'all') {
        navEl.style.display = 'none';
        titleEl.textContent = '累计支出';
      } else {
        navEl.style.display = 'flex';
        if (periodMode === 'day') {
          labelEl.textContent = `${cursorDate.getFullYear()}-${pad(cursorDate.getMonth() + 1)}-${pad(cursorDate.getDate())}`;
          titleEl.textContent = '当日支出';
        } else if (periodMode === 'month') {
          labelEl.textContent = `${cursorDate.getFullYear()}年${cursorDate.getMonth() + 1}月`;
          titleEl.textContent = '本月支出';
        } else {
          labelEl.textContent = `${cursorDate.getFullYear()}年`;
          titleEl.textContent = '本年支出';
        }
      }

      const periodRecords = filterByPeriod(records);
      const total = periodRecords.reduce((s, r) => s + Number(r.amount || 0), 0);
      document.getElementById('total-amount').textContent = '¥' + total.toFixed(2);
      document.getElementById('stat-count').textContent = periodRecords.length + ' 笔';

      let maxAmt = 0;
      const catTotals = {};
      CATEGORIES.forEach(c => catTotals[c] = 0);
      periodRecords.forEach(r => {
        const amt = Number(r.amount || 0);
        if (amt > maxAmt) maxAmt = amt;
        const c = CATEGORIES.includes(r.category) ? r.category : '购物';
        catTotals[c] += amt;
      });

      const days = getPeriodDaysCount(periodRecords);
      document.getElementById('stat-avg').textContent = '¥' + (Math.max(0, total) / days).toFixed(2);
      document.getElementById('stat-max').textContent = '¥' + maxAmt.toFixed(2);

      const sortedCats = [...CATEGORIES].sort((a, b) => catTotals[b] - catTotals[a]);
      document.getElementById('category-bars').innerHTML = sortedCats.map(cat => {
        const val = catTotals[cat];
        const pct = total > 0 ? Math.round((val / total) * 100) : 0;
        return `
          <div class="cat-item">
            <div class="cat-row">
              <span class="cat-name"><span class="cat-dot" style="background:${CAT_COLORS[cat]};"></span>${cat}</span>
              <span class="cat-val num">¥${val.toFixed(2)}<span class="cat-pct">${pct}%</span></span>
            </div>
            <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${CAT_COLORS[cat]};"></div></div>
          </div>
        `;
      }).join('');

      const filters = ['全部', ...CATEGORIES];
      document.getElementById('filter-bar').innerHTML = filters.map(f => `
        <button class="chip ${activeFilter === f ? 'active' : ''}" onclick="setFilter('${f}')">${f}</button>
      `).join('');

      const filtered = activeFilter === '全部'
        ? periodRecords
        : periodRecords.filter(r => r.category === activeFilter);

      const listEl = document.getElementById('tx-list');
      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">暂无消费记录，可点击下方导入账单或记一笔</div>';
        return;
      }

      const groups = [], map = {};
      filtered.forEach(r => {
        const info = formatDayHeader(r.timestamp);
        if (!map[info.key]) {
          map[info.key] = { label: info.label, total: 0, items: [] };
          groups.push(map[info.key]);
        }
        map[info.key].items.push(r);
        map[info.key].total += Number(r.amount || 0);
      });

      listEl.innerHTML = groups.map(g => `
        <div class="day-hdr">
          <span>${g.label}</span>
          <span class="num">支出 ¥${g.total.toFixed(2)}</span>
        </div>
        ${g.items.map(r => {
          const c = CATEGORIES.includes(r.category) ? r.category : '购物';
          return `
          <div class="tx-row" onclick="openEditSheet('${escapeHtml(r.id)}')">
            <div class="tx-badge" style="background:${CAT_COLORS[c]};">${CAT_SHORT[c]}</div>
            <div class="tx-mid">
              <div class="tx-title">${escapeHtml(r.merchant)}</div>
              <div class="tx-meta">${escapeHtml(r.channel || '记账')} · ${formatTimeShort(r.timestamp)}</div>
            </div>
            <div class="tx-right">
              <div class="tx-amt num">-${Number(r.amount).toFixed(2)}</div>
              <div class="tx-cat">${c}</div>
            </div>
          </div>`;
        }).join('')}
      `).join('');
    }

    function setFilter(f) {
      activeFilter = f;
      render();
    }

    render();
  </script>
</body>
</html>
