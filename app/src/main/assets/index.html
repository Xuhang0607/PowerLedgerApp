<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>喵记账</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --brand: #10b981;
      --brand-dark: #059669;
      --text: #1f2937;
      --muted: #8c93a0;
      --line: #f0f2f5;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 74px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    .num { font-variant-numeric: tabular-nums; }

    /* 顶部品牌色主卡（钱迹/一木记账风格） */
    .header-bg {
      background: linear-gradient(180deg, #10b981 0%, #0ea472 100%);
      color: #fff;
      padding: 12px 16px 20px;
      border-radius: 0 0 20px 20px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 700;
    }
    .brand-dot {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(255,255,255,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hdr-pill {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      color: #fff;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .hdr-pill input { display: none; }

    .period-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .period-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .p-arrow {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .mode-pills {
      display: flex;
      background: rgba(0,0,0,0.12);
      border-radius: 999px;
      padding: 2px;
    }
    .mode-pill {
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.8);
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
    }
    .mode-pill.active {
      background: #fff;
      color: var(--brand-dark);
    }

    .main-amt-label { font-size: 12px; color: rgba(255,255,255,0.85); }
    .main-amt { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; margin: 2px 0 12px; }
    .sub-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(255,255,255,0.13);
      border-radius: 12px;
      padding: 9px 10px;
      gap: 6px;
    }
    .sub-k { font-size: 11px; color: rgba(255,255,255,0.8); }
    .sub-v { font-size: 13.5px; font-weight: 600; margin-top: 1px; }

    /* 内容容器 */
    .container { padding: 12px 12px 0; }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(17,24,39,0.03);
    }
    .card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    /* 筛选条 */
    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 6px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      padding: 5px 12px;
      border-radius: 999px;
      border: none;
      background: #fff;
      color: #6b7280;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .chip.active {
      background: var(--brand);
      color: #fff;
      font-weight: 600;
    }

    /* 按天分组卡片 */
    .day-card {
      background: #fff;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(17,24,39,0.03);
    }
    .day-hdr {
      display: flex;
      justify-content: space-between;
      padding: 9px 14px;
      background: #fafbfc;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .tx-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-row:active { background: #f9fafb; }
    .tx-ico {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tx-ico svg { width: 18px; height: 18px; }
    .tx-mid { flex: 1; min-width: 0; }
    .tx-title {
      font-size: 14px;
      font-weight: 500;
      color: #111827;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .tx-amt {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      flex-shrink: 0;
    }

    /* 图表页 */
    .donut-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 4px 0;
    }
    .legend { flex: 1; }
    .leg-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .leg-row:last-child { margin-bottom: 0; }
    .leg-l { display: flex; align-items: center; gap: 6px; color: var(--text); }
    .leg-dot { width: 8px; height: 8px; border-radius: 50%; }
    .rank-row { margin-bottom: 11px; }
    .rank-row:last-child { margin-bottom: 0; }
    .rank-top {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 5px;
    }
    .bar-bg { height: 6px; background: #f1f3f6; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 13px;
    }

    /* 经典三段式底部导航（明细 | + | 图表） */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 58px;
      background: #fff;
      border-top: 1px solid #ebedf0;
      display: grid;
      grid-template-columns: 1fr 72px 1fr;
      align-items: center;
      z-index: 40;
    }
    .tab-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: #9ca3af;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      height: 100%;
    }
    .tab-item.active { color: var(--brand-dark); }
    .tab-item svg { width: 20px; height: 20px; }
    .fab-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .fab {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: var(--brand);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(16,185,129,0.35);
      transform: translateY(-10px);
      cursor: pointer;
    }
    .fab:active { transform: translateY(-9px) scale(0.96); }

    /* 底部弹窗 Sheet */
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      z-index: 100;
      display: none;
      align-items: flex-end;
    }
    .mask.open { display: flex; }
    .sheet {
      width: 100%;
      background: #fff;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 24px;
      max-height: 86vh;
      overflow-y: auto;
    }
    .sheet-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .sheet-title { font-size: 15.5px; font-weight: 700; }
    .sheet-close {
      border: none;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 12px;
      cursor: pointer;
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .cat-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 4px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: #f8f9fb;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
    }
    .cat-cell.selected {
      border-color: var(--brand);
      background: #ecfdf5;
      color: var(--brand-dark);
    }
    .field {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #f9fafb;
      outline: none;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .field:focus { border-color: var(--brand); background: #fff; }
    .btn-save {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--brand);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-del {
      width: 100%;
      padding: 11px;
      border-radius: 12px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17,24,39,0.9);
      color: #fff;
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 12.5px;
      z-index: 200;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- 顶部主概览区 -->
  <div class="header-bg">
    <div class="top-row">
      <div class="brand">
        <div class="brand-dot">🐱</div>
        <span>喵记账</span>
      </div>
      <div class="top-actions">
        <label class="hdr-pill">
          导入账单
          <input type="file" id="csv-file" accept=".csv,.xlsx,.zip,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*" onchange="handleFileUpload(event)" />
        </label>
        <button class="hdr-pill" onclick="clearAllData()">清空</button>
      </div>
    </div>

    <div class="period-row">
      <div class="period-switcher" id="period-nav">
        <button class="p-arrow" onclick="shiftPeriod(-1)">‹</button>
        <span id="period-label" class="num">2026年11月</span>
        <button class="p-arrow" onclick="shiftPeriod(1)">›</button>
      </div>
      <div class="mode-pills">
        <button class="mode-pill" id="tab-day" onclick="setPeriodMode('day')">日</button>
        <button class="mode-pill active" id="tab-month" onclick="setPeriodMode('month')">月</button>
        <button class="mode-pill" id="tab-year" onclick="setPeriodMode('year')">年</button>
        <button class="mode-pill" id="tab-all" onclick="setPeriodMode('all')">全部</button>
      </div>
    </div>

    <div class="main-amt-label" id="total-label">本月支出</div>
    <div class="main-amt num" id="total-amount">¥0.00</div>
    <div class="sub-metrics">
      <div><div class="sub-k">记账笔数</div><div class="sub-v num" id="stat-count">0 笔</div></div>
      <div><div class="sub-k">日均支出</div><div class="sub-v num" id="stat-avg">¥0.00</div></div>
      <div><div class="sub-k">单笔最高</div><div class="sub-v num" id="stat-max">¥0.00</div></div>
    </div>
  </div>

  <!-- 明细视图 -->
  <div class="container" id="view-detail">
    <div class="filters" id="filter-bar"></div>
    <div id="tx-list"></div>
  </div>

  <!-- 图表视图 -->
  <div class="container" id="view-chart" style="display:none;">
    <div class="card">
      <div class="card-hdr"><span>支出占比</span></div>
      <div class="donut-wrap" id="donut-wrap"></div>
    </div>
    <div class="card">
      <div class="card-hdr"><span>每日支出趋势</span></div>
      <div id="trend-chart"></div>
    </div>
    <div class="card">
      <div class="card-hdr"><span>分类排行</span></div>
      <div id="category-bars"></div>
    </div>
  </div>

  <!-- 底部导航栏 -->
  <div class="tabbar">
    <button class="tab-item active" id="nav-detail" onclick="switchTab('detail')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>明细</span>
    </button>
    <div class="fab-wrap">
      <button class="fab" onclick="openAddSheet()">+</button>
    </div>
    <button class="tab-item" id="nav-chart" onclick="switchTab('chart')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
      <span>图表</span>
    </button>
  </div>

  <!-- 记一笔弹窗 -->
  <div class="mask" id="add-mask" onclick="closeSheet('add-mask', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-hdr">
        <div class="sheet-title">记一笔</div>
        <button class="sheet-close" onclick="closeSheet('add-mask')">关闭</button>
      </div>
      <div class="cat-grid" id="add-cat-grid"></div>
      <input id="manual-amt" class="field num" type="number" inputmode="decimal" step="0.01" placeholder="金额（元）" style="font-size:20px;font-weight:700;" />
      <input id="manual-note" class="field" type="text" placeholder="商户或备注（选填）" />
      <input id="manual-date" class="field" type="date" />
      <button class="btn-save" onclick="saveManualEntry()">保存</button>
    </div>
  </div>

  <!-- 编辑/删除弹窗 -->
  <div class="mask" id="edit-mask" onclick="closeSheet('edit-mask', event)">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-hdr">
        <div class="sheet-title" id="edit-title">修改分类</div>
        <button class="sheet-close" onclick="closeSheet('edit-mask')">关闭</button>
      </div>
      <div class="cat-grid" id="edit-cat-grid"></div>
      <button class="btn-del" onclick="deleteEditingRecord()">删除这笔记录</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'power_ledger_records_v1';
    const MERCHANT_RULES_KEY = 'power_ledger_merchant_rules_v1';
    const CATEGORIES = ['餐饮', '交通', '日用便利', '生活缴费', '休闲娱乐', '转账人情', '购物'];
    const CAT_META = {
      '餐饮': { color: '#f59e0b', bg: '#fef3c7', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>' },
      '交通': { color: '#3b82f6', bg: '#dbeafe', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>' },
      '日用便利': { color: '#10b981', bg: '#d1fae5', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>' },
      '生活缴费': { color: '#06b6d4', bg: '#cffafe', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>' },
      '休闲娱乐': { color: '#ec4899', bg: '#fce7f3', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="4"/></svg>' },
      '转账人情': { color: '#6366f1', bg: '#e0e7ff', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>' },
      '购物': { color: '#8b5cf6', bg: '#ede9fe', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>' }
    };

    const ORDERED_KEYWORDS = [
      ['生活缴费', ['话费', '充值', '中国移动', '中国联通', '中国电信', '物业', '水费', '电费', '燃气', '宽带', '供暖', '社保']],
      ['休闲娱乐', ['烫发', '染发', '美发', '理发', '沙龙', '美甲', '滑雪', '门票', '影院', '电影', 'ktv', '游乐', '景区', '健身', '按摩', '足浴', '网费', '会员', '游戏', '网络']],

      if (mKey && merchantRules[mKey] && CATEGORIES.includes(merchantRules[mKey])) return merchantRules[mKey];

    function getPeriodDaysCount(periodList) {
      if (periodMode === 'day') return 1;
      if (periodMode === 'month') {
        const now = new Date();
        if (cursorDate.getFullYear() === now.getFullYear() && cursorDate.getMonth() === now.getMonth()) return Math.max(1, now.getDate());
        return new Date(cursorDate.getFullYear(), cursorDate.getMonth() + 1, 0).getDate();
      }
      if (periodMode === 'year') {
        const now = new Date();
        if (cursorDate.getFullYear() === now.getFullYear()) return Math.max(1, Math.ceil((now - new Date(now.getFullYear(), 0, 1)) / 86400000));
        return 365;
      }
      return Math.max(1, new Set(periodList.map(r => {

      })).size);

    /* CSV / XLSX / ZIP 解析 */
    function parseCsvLine(line) {
      const res = []; let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = !inQuotes; }
        else if (ch === ',' && !inQuotes) { res.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      res.push(cur.trim()); return res;
    }

    function decodeCsvBuffer(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes.length >= 2 && ((bytes[0] === 0xFF && bytes[1] === 0xFE) || (bytes[0] === 0xFE && bytes[1] === 0xFF))) {
        try { return new TextDecoder(bytes[0] === 0xFF ? 'utf-16le' : 'utf-16be').decode(buffer); } catch (e) {}
      }
      const utf8 = new TextDecoder('utf-8').decode(buffer);
      if (utf8.includes('交易时间') && utf8.includes('交易对方')) return utf8;
      try { const gbk = new TextDecoder('gb18030').decode(buffer); if (gbk.includes('交易时间') && gbk.includes('交易对方')) return gbk; } catch (e) {}
      return utf8;
    }

    async function unzipEntries(buffer) {
      const view = new DataView(buffer), bytes = new Uint8Array(buffer);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd === -1) throw new Error('Invalid XLSX/ZIP');
      let ptr = view.getUint32(eocd + 16, true);
      const total = view.getUint16(eocd + 10, true), entries = {}, dec = new TextDecoder('utf-8');
      for (let i = 0; i < total; i++) {
        if (view.getUint32(ptr, true) !== 0x02014b50) break;
        const method = view.getUint16(ptr + 10, true), compSize = view.getUint32(ptr + 20, true);
        const nLen = view.getUint16(ptr + 28, true), eLen = view.getUint16(ptr + 30, true), cLen = view.getUint16(ptr + 32, true), lOff = view.getUint32(ptr + 42, true);
        const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nLen));
        ptr += 46 + nLen + eLen + cLen;
        const lnLen = view.getUint16(lOff + 26, true), leLen = view.getUint16(lOff + 28, true), start = lOff + 30 + lnLen + leLen;
        const slice = bytes.subarray(start, start + compSize);
        if (method === 0) entries[name] = slice.buffer.slice(slice.byteOffset, slice.byteOffset + slice.byteLength);
        else if (method === 8) entries[name] = await new Response(new Blob([slice]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      }
      return entries;
    }

    function colRefToIndex(ref) {
      const m = (ref || '').match(/^([A-Z]+)/i); if (!m) return -1;
      let idx = 0; const letters = m[1].toUpperCase();
      for (let i = 0; i < letters.length; i++) idx = idx * 26 + (letters.charCodeAt(i) - 64);
      return idx - 1;
    }

    function parseXlsxEntries(entries) {
      const dec = new TextDecoder('utf-8'), dom = new DOMParser(), shared = [];
      if (entries['xl/sharedStrings.xml']) {
        const sis = dom.parseFromString(dec.decode(entries['xl/sharedStrings.xml']), 'text/xml').getElementsByTagName('si');
        for (let i = 0; i < sis.length; i++) {
          const ts = sis[i].getElementsByTagName('t'); let s = '';
          for (let j = 0; j < ts.length; j++) s += ts[j].textContent || '';
          shared.push(s);
        }
      }
      const sheetKey = Object.keys(entries).find(k => /^xl\/worksheets\/sheet\d+\.xml$/i.test(k));
      if (!sheetKey) return [];
      const rowNodes = dom.parseFromString(dec.decode(entries[sheetKey]), 'text/xml').getElementsByTagName('row'), rows = [];
      for (let r = 0; r < rowNodes.length; r++) {
        const cells = rowNodes[r].getElementsByTagName('c'), rowArr = [];
        for (let c = 0; c < cells.length; c++) {
          const cell = cells[c], colIdx = colRefToIndex(cell.getAttribute('r')), target = colIdx >= 0 ? colIdx : rowArr.length, t = cell.getAttribute('t');
          let val = '';
          if (t === 's') { const v = cell.getElementsByTagName('v')[0]; val = v ? (shared[parseInt(v.textContent, 10)] || '') : ''; }
          else if (t === 'inlineStr') { const ts = cell.getElementsByTagName('t'); for (let k = 0; k < ts.length; k++) val += ts[k].textContent || ''; }
          else { const v = cell.getElementsByTagName('v')[0]; val = v ? (v.textContent || '') : ''; }
          rowArr[target] = val.trim();
        }
        rows.push(rowArr.map(v => v || ''));
      }
      return rows;
    }

    async function extractRows(buffer) {
      const bytes = new Uint8Array(buffer);
      if (bytes.length >= 2 && bytes[0] === 0x50 && bytes[1] === 0x4B) {
        const entries = await unzipEntries(buffer);
        if (entries['xl/workbook.xml'] || Object.keys(entries).some(k => k.startsWith('xl/worksheets/'))) return parseXlsxEntries(entries);
        const csvKey = Object.keys(entries).find(k => k.toLowerCase().endsWith('.csv'));
        if (csvKey) return decodeCsvBuffer(entries[csvKey]).split(/\r?\n/).filter(l => l.trim()).map(parseCsvLine);
        const xlsxKey = Object.keys(entries).find(k => k.toLowerCase().endsWith('.xlsx'));
        if (xlsxKey) return parseXlsxEntries(await unzipEntries(entries[xlsxKey]));
      }
      return decodeCsvBuffer(buffer).split(/\r?\n/).filter(l => l.trim()).map(parseCsvLine);
    }

    function handleFileUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const rows = await extractRows(reader.result);
          let headerIdx = -1, headers = [];
          for (let i = 0; i < rows.length; i++) {
            const cols = rows[i].map(c => String(c || '').replace(/^\uFEFF/, '').trim());
            if (cols.some(c => c.includes('交易时间')) && cols.some(c => c.includes('交易对方')) && cols.some(c => c.includes('收/支'))) {
              headerIdx = i; headers = cols; break;
            }
          }
          if (headerIdx === -1) { showToast('未识别到微信/支付宝账单表头'); event.target.value = ''; return; }

          const idxTime = headers.findIndex(h => h.includes('交易时间'));
          const idxTxType = headers.findIndex(h => h.includes('交易类型'));
          const idxPeer = headers.findIndex(h => h.includes('交易对方'));
          const idxGoods = headers.findIndex(h => h.includes('商品'));
          const idxType = headers.findIndex(h => h.includes('收/支'));
          const idxAmt = headers.findIndex(h => h.includes('金额'));
          const idxStatus = headers.findIndex(h => h.includes('当前状态') || h.includes('交易状态'));
          const idxOrder = headers.findIndex(h => h.includes('交易单号') || h.includes('交易订单号'));

          const existingOrders = new Set(records.map(r => r.orderNo).filter(Boolean));
          let imported = 0, skippedRefund = 0;

          for (let i = headerIdx + 1; i < rows.length; i++) {
            const cols = rows[i];
            if (!cols || cols.length < 4 || !(cols[idxType] || '').includes('支出')) continue;
            let amount = parseFloat((cols[idxAmt] || '').replace(/[¥￥,\s元]/g, ''));
            if (!amount || amount <= 0) continue;

            const status = idxStatus >= 0 ? (cols[idxStatus] || '').trim() : '';
            if (status.includes('已全额退款') || status === '已退款' || status.includes('交易关闭')) { skippedRefund++; continue; }
            const partial = status.match(/已退款\s*[（(]\s*[¥￥]?\s*([0-9]+(?:\.[0-9]{1,2})?)\s*[)）]/);
            if (partial) {
              const ref = parseFloat(partial[1]);
              if (ref > 0) amount = Math.round((amount - ref) * 100) / 100;
              if (amount <= 0) { skippedRefund++; continue; }
            }

            const orderNo = idxOrder >= 0 ? (cols[idxOrder] || '').trim() : '';
            const timeStr = (cols[idxTime] || '').trim();
            const txType = idxTxType >= 0 ? (cols[idxTxType] || '').trim() : '';
            const peer = (cols[idxPeer] || '').trim();
            const goods = idxGoods >= 0 ? (cols[idxGoods] || '').trim() : '';
            const dedupOrder = orderNo || `${timeStr}_${peer}_${amount.toFixed(2)}`;
            if (existingOrders.has(dedupOrder)) continue;
            existingOrders.add(dedupOrder);

            const merchant = peer || (goods && goods !== '/' ? goods : '账单导入');
            const ts = Date.parse(timeStr.replace(/-/g, '/')) || Date.now();
            const category = classify(`${txType} ${peer} ${goods}`, amount, merchant);

            records.push({
              id: 'csv_' + dedupOrder, orderNo: dedupOrder, amount,
              merchant: merchant.slice(0, 24), category,
              channel: partial ? '账单(已扣退款)' : '账单导入', timestamp: ts
            });
            imported++;
          }

          records.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
          saveRecords();
          if (imported > 0 && records.length > 0) cursorDate = new Date(records[0].timestamp);
          render();
          showToast(imported > 0 ? `导入 ${imported} 笔` + (skippedRefund > 0 ? `，已过滤 ${skippedRefund} 笔退款` : '') : (skippedRefund > 0 ? `已过滤 ${skippedRefund} 笔退款，无新支出` : '没有新的支出记录'));
        } catch (err) { showToast('解析失败'); }
        event.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    function formatTimeShort(ts) {
      const d = new Date(ts || Date.now()), pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;

    function formatDayHeader(ts) {
      const d = new Date(ts || Date.now()), weeks = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'], pad = n => String(n).padStart(2, '0');
      return { key: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, label: `${d.getMonth() + 1}月${d.getDate()}日 ${weeks[d.getDay()]}` };
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderCharts(periodRecords, catTotals, total) {
      const sorted = [...CATEGORIES].filter(c => catTotals[c] > 0).sort((a, b) => catTotals[b] - catTotals[a]);
      const donutEl = document.getElementById('donut-wrap');
      if (!sorted.length || total <= 0) {
        donutEl.innerHTML = '<div class="empty" style="padding:18px;width:100%;">暂无支出数据</div>';
      } else {
        const r = 42, circ = 2 * Math.PI * r;
        let offset = 0;
        const segs = sorted.map(c => {
          const frac = catTotals[c] / total;
          const len = frac * circ;
          const seg = `<circle cx="55" cy="55" r="${r}" fill="transparent" stroke="${CAT_META[c].color}" stroke-width="14" stroke-dasharray="${len} ${circ}" stroke-dashoffset="${-offset}" />`;
          offset += len;
          return seg;
        }).join('');
        const topCat = sorted[0];
        const topPct = Math.round((catTotals[topCat] / total) * 100);
        donutEl.innerHTML = `
          <svg width="110" height="110" viewBox="0 0 110 110" style="transform:rotate(-90deg);flex-shrink:0;">
            <circle cx="55" cy="55" r="${r}" fill="transparent" stroke="#f1f5f9" stroke-width="14"/>
            ${segs}
            <g transform="rotate(90 55 55)">
              <text x="55" y="51" text-anchor="middle" font-size="11" fill="#6b7280">${topCat}</text>
              <text x="55" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">${topPct}%</text>
            </g>
          </svg>
          <div class="legend">
            ${sorted.slice(0, 5).map(c => `
              <div class="leg-row">
                <span class="leg-l"><span class="leg-dot" style="background:${CAT_META[c].color};"></span>${c}</span>
                <span class="num" style="font-weight:600;">${Math.round((catTotals[c] / total) * 100)}%</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      // 每日柱状图
      const dayMap = {};
      periodRecords.forEach(r => {
        const d = new Date(r.timestamp || Date.now());
        const key = `${d.getMonth() + 1}/${d.getDate()}`;
        dayMap[key] = (dayMap[key] || 0) + Number(r.amount || 0);
      });
      const dayKeys = Object.keys(dayMap).reverse().slice(-14);
      const trendEl = document.getElementById('trend-chart');
      if (!dayKeys.length) {
        trendEl.innerHTML = '<div class="empty" style="padding:14px;">暂无趋势数据</div>';
      } else {
        const maxDay = Math.max(...dayKeys.map(k => dayMap[k]), 1);
        const w = 320, h = 100, barW = Math.max(8, Math.min(20, Math.floor((w - 20) / dayKeys.length) - 6));
        const step = (w - 20) / dayKeys.length;
        const bars = dayKeys.map((k, idx) => {
          const val = dayMap[k];
          const bh = Math.max(3, Math.round((val / maxDay) * 68));
          const x = 10 + idx * step + (step - barW) / 2;
          const y = 76 - bh;
          return `
            <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="#10b981" opacity="0.85" />
            <text x="${x + barW / 2}" y="92" text-anchor="middle" font-size="9" fill="#9ca3af">${k}</text>
          `;
        }).join('');
        trendEl.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100">${bars}</svg>`;
      }

      document.getElementById('category-bars').innerHTML = [...CATEGORIES].sort((a, b) => catTotals[b] - catTotals[a]).map(c => {
        const val = catTotals[c], pct = total > 0 ? Math.round((val / total) * 100) : 0;
        return `<div class="rank-row">
          <div class="rank-top">
            <span style="font-weight:500;">${c}</span>
            <span class="num" style="font-weight:600;">¥${val.toFixed(2)} <span style="color:#8c93a0;font-weight:400;">(${pct}%)</span></span>
          </div>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${CAT_META[c].color};"></div></div>
        </div>`;
      }).join('');
    }

    function render() {
      const navEl = document.getElementById('period-nav');
      const labelEl = document.getElementById('period-label');
      const titleEl = document.getElementById('total-label');
      const pad = n => String(n).padStart(2, '0');

      if (periodMode === 'all') {
        navEl.style.visibility = 'hidden';
        titleEl.textContent = '累计支出';
      } else {
        navEl.style.visibility = 'visible';
        if (periodMode === 'day') { labelEl.textContent = `${cursorDate.getFullYear()}-${pad(cursorDate.getMonth() + 1)}-${pad(cursorDate.getDate())}`; titleEl.textContent = '当日支出'; }
        else if (periodMode === 'month') { labelEl.textContent = `${cursorDate.getFullYear()}年${cursorDate.getMonth() + 1}月`; titleEl.textContent = '本月支出'; }
        else { labelEl.textContent = `${cursorDate.getFullYear()}年`; titleEl.textContent = '本年支出'; }
      }

      const periodRecords = filterByPeriod(records);
      const total = periodRecords.reduce((s, r) => s + Number(r.amount || 0), 0);
      document.getElementById('total-amount').textContent = '¥' + total.toFixed(2);
      document.getElementById('stat-count').textContent = periodRecords.length + ' 笔';

      let maxAmt = 0;
      const catTotals = {};
      CATEGORIES.forEach(c => catTotals[c] = 0);
      periodRecords.forEach(r => {
        const amt = Number(r.amount || 0);
        if (amt > maxAmt) maxAmt = amt;
        const c = CATEGORIES.includes(r.category) ? r.category : '购物';
        catTotals[c] += amt;
      });

      const days = getPeriodDaysCount(periodRecords);
      document.getElementById('stat-avg').textContent = '¥' + (Math.max(0, total) / days).toFixed(2);
      document.getElementById('stat-max').textContent = '¥' + maxAmt.toFixed(2);

      if (activeTab === 'chart') {
        renderCharts(periodRecords, catTotals, total);
        return;
      }

      document.getElementById('filter-bar').innerHTML = ['全部', ...CATEGORIES].map(f => `
        <button class="chip ${activeFilter === f ? 'active' : ''}" onclick="setFilter('${f}')">${f}</button>
      `).join('');

      const filtered = activeFilter === '全部' ? periodRecords : periodRecords.filter(r => r.category === activeFilter);
      const listEl = document.getElementById('tx-list');
      if (!filtered.length) {
        listEl.innerHTML = '<div class="empty">暂无支出记录，点击右上角「导入账单」或下方「+」记一笔</div>';
        return;
      }

      const groups = [], map = {};
      filtered.forEach(r => {
        const info = formatDayHeader(r.timestamp);
        if (!map[info.key]) { map[info.key] = { label: info.label, total: 0, items: [] }; groups.push(map[info.key]); }
        map[info.key].items.push(r);
        map[info.key].total += Number(r.amount || 0);
      });

      listEl.innerHTML = groups.map(g => `
        <div class="day-card">
          <div class="day-hdr">
            <span>${g.label}</span>
            <span class="num">支出 ${g.total.toFixed(2)}</span>
          </div>
          ${g.items.map(r => {
            const c = CATEGORIES.includes(r.category) ? r.category : '购物';
            const m = CAT_META[c];
            return `
            <div class="tx-row" onclick="openEditSheet('${escapeHtml(r.id)}')">
              <div class="tx-ico" style="background:${m.bg};color:${m.color};">${m.svg}</div>
              <div class="tx-mid">
                <div class="tx-title">${escapeHtml(r.merchant)}</div>
                <div class="tx-sub">${c} · ${formatTimeShort(r.timestamp)}</div>
              </div>
              <div class="tx-amt num">-${Number(r.amount).toFixed(2)}</div>
            </div>`;
          }).join('')}
        </div>
      `).join('');
    }

    function setFilter(f) { activeFilter = f; render(); }

    render();
  </script>
</body>
</html>
